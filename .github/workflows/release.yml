name: Auto Release on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          PREFIX=$(echo "$CURRENT" | sed 's/[0-9]*$//')
          NUM=$(echo "$CURRENT" | grep -o '[0-9]*$')
          NEXT="${PREFIX}$((NUM + 1))"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Bumping $CURRENT → $NEXT"

      - name: Update VERSION and CHANGELOG
        env:
          NEXT: ${{ steps.version.outputs.next }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$NEXT" > VERSION

          TODAY=$(date +%Y-%m-%d)
          python3 - <<PYEOF
          import os, re

          changelog = open('CHANGELOG.md').read()
          version   = os.environ['NEXT']
          title     = os.environ['PR_TITLE']
          pr_num    = os.environ['PR_NUMBER']
          today     = '${TODAY}'

          entry = (
              f'## [{version}] - {today}\n\n'
              f'### Changed\n'
              f'- PR #{pr_num}: {title}\n\n'
          )

          # Insert right after the [Unreleased] header line
          changelog = re.sub(
              r'(## \[Unreleased\]\n)',
              r'\1\n' + entry,
              changelog,
              count=1,
          )
          open('CHANGELOG.md', 'w').write(changelog)
          PYEOF

      - name: Commit, tag, push
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "Release $NEXT"
          git tag "$NEXT"
          git push origin main "$NEXT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh release create "$NEXT" \
            --title "$NEXT" \
            --latest \
            --notes "PR #${PR_NUMBER}: ${PR_TITLE}"
